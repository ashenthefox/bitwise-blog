name: Skill evals

# Runs the skills' trigger and output evals when someone asks for it, and records the pass rates, so a
# model or Claude Code update that changes how a skill behaves can be checked for even though nothing
# in the repo changed. A run fails when a skill's pass rate falls by more than the tolerance against
# the previous full run's record, or when a run errored and measured nothing. See "The full run" in
# .claude/skills/skill-authoring/references/maintenance.md.
#
# It never runs on its own. It costs real money (about US$73 for every skill and both kinds; about
# US$42 for kind "trigger" alone and US$31 for kind "output"; one skill is US$4 to $37), and output
# scores have moved between runs of an unchanged skill (#237: the judge; four runs of one suite are
# now within 0.03, the other suites have one run each, #248), so a schedule would spend that every
# month and could still fail on noise. Start it
# from the Actions tab (Run workflow), or:
#   gh workflow run skill-evals.yml -f skills=pedagogical-diagrams -f kind=trigger -f max_cost_usd=10
#
# Set-up, once:
#   1. Settings → Secrets and variables → Actions → Secrets → New repository secret:
#      ANTHROPIC_API_KEY = <an Anthropic API key>. Without it the run stops at its second step.
#   2. Optional variables: SKILL_EVALS_MODEL and SKILL_EVALS_JUDGE_MODEL (default
#      claude-sonnet-5-5 for both), SKILL_EVALS_MAX_COST_USD (default 100).
#   3. Run it once for every skill and both kinds to record the baseline later runs compare with.
#
# Only people with write access to the repository can start it. `npm run skill-evals` is the same run
# on your own machine and your own login, with no secret.
on:
  workflow_dispatch:
    inputs:
      skills:
        description: "Skills to run, comma-separated. Empty runs every skill, about US$73 for both kinds"
        required: false
        default: ""
      kind:
        description: "Which evals to run. Of a full run, trigger is about US$42 and output about US$31 (pedagogical-writing is $22 of that)"
        required: false
        type: choice
        options: [both, trigger, output]
        default: both
      model:
        description: "Agent model (empty: the SKILL_EVALS_MODEL variable, else the script's default)"
        required: false
        default: ""
      max_cost_usd:
        description: "Cost ceiling for the whole run, in US dollars (empty: the variable, else 100)"
        required: false
        default: ""

# actions: read lets the run download the previous run's record.
permissions:
  contents: read
  actions: read

concurrency:
  group: skill-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Unpinned on purpose: the point is to see what a user gets. The version is in the record, so a
      # drop can be attributed to a Claude Code update or to a model.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Check the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY secret is not set (see the header of this workflow)."
            exit 1
          fi

      # The baseline of the last run that wrote one: a complete run with no error, so a regression alerts
      # once and the new level becomes the baseline, while a run of one skill or one that errored never
      # replaces it. Nothing to fetch on the first run.
      - name: Fetch the previous record
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p previous
          for id in $(gh run list --workflow skill-evals.yml --status completed --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --name skill-evals-record --dir previous; then
              echo "previous record: run $id"
              break
            fi
          done
          ls previous

      # Inputs reach the script through the environment, never through the shell text.
      - name: Run the evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILLS: ${{ inputs.skills }}
          KIND: ${{ inputs.kind }}
          MODEL: ${{ inputs.model || vars.SKILL_EVALS_MODEL }}
          JUDGE_MODEL: ${{ vars.SKILL_EVALS_JUDGE_MODEL }}
          MAX_COST_USD: ${{ inputs.max_cost_usd || vars.SKILL_EVALS_MAX_COST_USD }}
        run: |
          args=(--out skill-evals --previous previous/baseline.json)
          if [ -n "$SKILLS" ]; then args+=(--skills "$SKILLS"); fi
          if [ -n "$KIND" ]; then args+=(--kind "$KIND"); fi
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          if [ -n "$JUDGE_MODEL" ]; then args+=(--judge-model "$JUDGE_MODEL"); fi
          if [ -n "$MAX_COST_USD" ]; then args+=(--max-cost-usd "$MAX_COST_USD"); fi
          node scripts/skill-evals.mts "${args[@]}"

      # Only the baseline and the summary (the script writes baseline.json only for a complete run with no
      # error): the raw results hold model output and the artifact of a public repository is readable by any
      # signed-in GitHub user. 90 days is the most a public repository keeps.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-evals-record
          path: |
            skill-evals/baseline.json
            skill-evals/summary.md
          retention-days: 90
          if-no-files-found: warn
